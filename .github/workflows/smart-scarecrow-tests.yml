name: Smart Scarecrow software checks
on:
  push:
    paths: ['projects/smart-scarecrow-ml/**', '.github/workflows/smart-scarecrow-tests.yml']
  pull_request:
    paths: ['projects/smart-scarecrow-ml/**', '.github/workflows/smart-scarecrow-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/smart-scarecrow-ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: projects/smart-scarecrow-ml/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
